<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1017" />
    <title>404 · 页面不存在</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #e9eef6;
        background: #0b1017;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 2rem 1.25rem;
        place-items: center;
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      .code {
        margin: 0 0 1rem;
        color: #6fbfc6;
        font-size: clamp(4rem, 16vw, 6rem);
        font-weight: 600;
        letter-spacing: 0.06em;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }

      .message {
        margin: 0.75rem 0 2rem;
        color: #96a4b7;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.7rem 1.3rem;
        border: 1px solid #345a60;
        border-radius: 0.5rem;
        color: #d4f1f2;
        background: #17383c;
        text-decoration: none;
      }

      a:hover {
        background: #20494e;
      }

      a:focus-visible {
        outline: 2px solid #6fbfc6;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>页面不存在</h1>
      <p class="message">你访问的页面不存在或已被移除。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
