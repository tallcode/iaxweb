services:
  iaxweb:
    # Built and published by .github/workflows/docker-publish.yml
    image: ghcr.io/tallcode/iaxweb:latest
    container_name: iaxweb
    # Match the bind-mounted ./data directory's host ownership. Set PUID/PGID
    # in .env when they differ from the usual 1000:1000 Linux account.
    user: '${PUID:-1000}:${PGID:-1000}'
    restart: unless-stopped
    ports:
      # host 8059 -> container 3000
      - '8059:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
