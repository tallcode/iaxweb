services:
  iaxweb:
    # Built and published by .github/workflows/docker-publish.yml
    image: ghcr.io/tallcode/iaxweb:latest
    container_name: iaxweb
    # Match the bind-mounted ./data directory's host ownership. Set PUID/PGID
    # in .env when they differ from the usual 1000:1000 Linux account.
    user: '${PUID:-1000}:${PGID:-1000}'
    restart: unless-stopped
    # Reserve host capacity on small servers; native inference must not consume
    # both cores or push the entire host into memory reclaim / swapping.
    cpus: '1.0'
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    ports:
      # host 8059 -> container 3000
      - '8059:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      # Includes config/models; weights are maintained on the host, not in the image.
      - ./config:/app/config:ro
      - ./data:/app/data
